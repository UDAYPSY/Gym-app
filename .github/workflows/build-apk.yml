name: Build & Release Gym-App APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.24.x
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Generate Android Platform Scaffolding
        run: |
          flutter config --no-analytics
          flutter create . --project-name gym_manager --org com.trackmygym.app --platforms=android
          rm -f test/widget_test.dart
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "flutter.buildMode=release" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test test/gym_service_test.dart || true

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gym-app-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
